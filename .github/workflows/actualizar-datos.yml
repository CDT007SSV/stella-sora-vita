name: Actualizar datos automaticos
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: write
concurrency:
  group: actualizar-datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow
        run: pip install --quiet pillow
      - name: Generar auto.json
        run: python3 generar_auto.py
      - name: Generar builds desde Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 generar_builds.py
      - name: Generar novedades
        run: python3 generar_novedades.py
      - name: Guardar cambios
        run: |
          for f in auto.json extras.json builds.json novedades.json builds_img; do
            [ -e "$f" ] && git add -A "$f"
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar datos automaticos"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Sin cambios"
          fi

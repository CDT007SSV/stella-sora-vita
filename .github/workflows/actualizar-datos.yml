name: Actualizar datos automaticos
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
permissions:
  contents: write
concurrency:
  group: actualizar-datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar auto.json
        run: python3 generar_auto.py
      - name: Generar builds desde Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 generar_builds.py
      - name: Guardar cambios
        run: |
          git add -A auto.json builds.json builds_img 2>/dev/null || true
          if [ -n "$(git status --porcelain auto.json builds.json builds_img)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A auto.json builds.json builds_img 2>/dev/null || true
            git commit -m "Actualizar datos automaticos"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Sin cambios"
          fi

name: Traducir pendientes
on:
  workflow_dispatch:
  schedule:
    - cron: "40 10 * * *"
permissions:
  contents: write
concurrency:
  group: autotraducir
  cancel-in-progress: false
jobs:
  traducir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traducir con el traductor gratuito
        run: python3 autotraducir.py
      - name: Guardar cambios
        run: |
          git add -A textos traducciones.json traducciones_discos.json fichas/pendientes.json discos/pendientes.json
          if [ -f traducciones_auto.json ]; then git add traducciones_auto.json; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Traduccion automatica de textos pendientes (por revisar)"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Sin cambios"
          fi

name: Fichas de discos
on:
  workflow_dispatch:
  schedule:
    - cron: "37 9 * * 1"
permissions:
  contents: write
concurrency:
  group: discos
  cancel-in-progress: false
jobs:
  discos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generar fichas de discos
        run: |
          python3 generar_discos.py
          python3 generar_presets.py
      - name: Guardar cambios
        run: |
          git add -A discos presets.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Fichas de discos"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Sin cambios"
          fi
